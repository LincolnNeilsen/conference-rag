name: Test & Deploy

# Every push runs the RLS test. Pages deploys only from main, and only if the test passed.
# Requires: Settings → Pages → Source set to "GitHub Actions" (not "Deploy from a branch").

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python tests/test_rls.py

      - run: python tests/test_split_sentences.py

  deploy:
    needs: rls-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
